name: Application checks

on:
  push:
    paths:
      - '.github/workflows/application-checks.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'playwright.config.ts'
      - 'tests/browser/**'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'contracts/**'
      - 'scripts/contracts.mjs'
      - 'docs/contract-coverage.md'
      - 'docs/reference/**'
      - 'docs/phases/**'
      - 'redocly.yaml'
      - '.gitattributes'
  pull_request:
    paths:
      - '.github/workflows/application-checks.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'playwright.config.ts'
      - 'tests/browser/**'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'contracts/**'
      - 'scripts/contracts.mjs'
      - 'docs/contract-coverage.md'
      - 'docs/reference/**'
      - 'docs/phases/**'
      - 'redocly.yaml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAWSEL_API_HOST: 127.0.0.1
      TAWSEL_API_PORT: 3001
      VITE_TAWSEL_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run application checks
        run: npm run check
