name: Build pilot images
on:
  push:
    branches: [codex/dokploy-pilot]
  workflow_dispatch:
    inputs:
      app_origin:
        description: Exact public HTTPS origin for the app build
        required: true
        default: https://app.switch2tech.cloud
        type: string
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate release input and load pinned base images
        env:
          APP_ORIGIN_INPUT: ${{ inputs.app_origin || 'https://app.switch2tech.cloud' }}
        run: |
          node -e "const u=new URL(process.env.APP_ORIGIN_INPUT);if(u.protocol!=='https:'||u.origin!==process.env.APP_ORIGIN_INPUT||u.username||u.password)process.exit(1)"
          for name in node nginx keycloak jdk postgres; do echo "${name^^}_BASE=$(jq -r ".$name" deploy/base-images.json)" >> "$GITHUB_ENV"; done
          echo "APP_ORIGIN=$APP_ORIGIN_INPUT" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Runtime
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tawsel-runtime:pilot-${{ github.sha }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_BASE }}
            NGINX_IMAGE=${{ env.NGINX_BASE }}
            APP_ORIGIN=${{ env.APP_ORIGIN }}
      - name: Web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tawsel-web:pilot-${{ github.sha }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_BASE }}
            NGINX_IMAGE=${{ env.NGINX_BASE }}
            APP_ORIGIN=${{ env.APP_ORIGIN }}
      - name: Custom issuer
        id: issuer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Keycloak.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tawsel-issuer:pilot-${{ github.sha }}
          build-args: |
            APP_IMAGE=${{ env.IMAGE_PREFIX }}/tawsel-runtime@${{ steps.runtime.outputs.digest }}
            KEYCLOAK_IMAGE=${{ env.KEYCLOAK_BASE }}
            JDK_IMAGE=${{ env.JDK_BASE }}
            APP_ORIGIN=${{ env.APP_ORIGIN }}
      - name: Issuer gateway
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/AuthGateway.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tawsel-issuer-gateway:pilot-${{ github.sha }}
          build-args: NGINX_IMAGE=${{ env.NGINX_BASE }}
      - name: Configured VROOM
        id: vroom
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Vroom.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tawsel-vroom:pilot-${{ github.sha }}
          build-args: VROOM_BASE_IMAGE=ghcr.io/vroom-project/vroom-docker@sha256:247d5683d6745c755d718a156d16b16aac80baccc276a003a68b986c13883b08
      - name: PostgreSQL with pgBackRest
        id: database
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Postgres.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tawsel-postgres:pilot-${{ github.sha }}
          build-args: POSTGRES_IMAGE=${{ env.POSTGRES_BASE }}
      - name: Nominatim without password tracing
        id: nominatim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Nominatim.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tawsel-nominatim:pilot-${{ github.sha }}
          build-args: NOMINATIM_BASE_IMAGE=mediagis/nominatim@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
      - name: Record immutable image references
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg origin "$APP_ORIGIN" \
            --arg runtime "${IMAGE_PREFIX}/tawsel-runtime@${{ steps.runtime.outputs.digest }}" \
            --arg web "${IMAGE_PREFIX}/tawsel-web@${{ steps.web.outputs.digest }}" \
            --arg issuer "${IMAGE_PREFIX}/tawsel-issuer@${{ steps.issuer.outputs.digest }}" \
            --arg gateway "${IMAGE_PREFIX}/tawsel-issuer-gateway@${{ steps.gateway.outputs.digest }}" \
            --arg vroom "${IMAGE_PREFIX}/tawsel-vroom@${{ steps.vroom.outputs.digest }}" \
            --arg database "${IMAGE_PREFIX}/tawsel-postgres@${{ steps.database.outputs.digest }}" \
            --arg nominatim "${IMAGE_PREFIX}/tawsel-nominatim@${{ steps.nominatim.outputs.digest }}" \
            '{commit:$commit,appOrigin:$origin,images:{runtime:$runtime,web:$web,issuer:$issuer,gateway:$gateway,vroom:$vroom,database:$database,nominatim:$nominatim}}' > release-images.json
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-image-digests
          path: release-images.json
