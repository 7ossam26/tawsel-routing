# Online team pilot only. The web UI requires allowlisted Keycloak subjects.
name: ${MOCK_PROJECT:?separate mock project required}
x-mock: &mock
  image: ${APP_IMAGE:?immutable application image required}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment:
    NODE_ENV: production
    MOCK_ERP_MANAGED_MIGRATIONS: 'true'
    MOCK_ERP_CONFIG: /run/secrets/mock.json
    MOCK_ERP_DATABASE_CA_FILE: /run/secrets/ca.pem
    NODE_EXTRA_CA_CERTS: /run/secrets/ca.pem
  secrets:
    - source: mock-env
      target: mock.env
    - source: mock-config
      target: mock.json
    - source: database-ca
      target: ca.pem
  networks: [database]
  cpus: ${MOCK_CPUS:?inventory-based mock CPU limit required}
  mem_limit: ${MOCK_MEMORY:?inventory-based mock memory limit required}
services:
  mock-migrate:
    <<: *mock
    profiles: [release]
    restart: 'no'
    command: [node, --env-file=/run/secrets/mock.env, --import, tsx, scripts/deployment-mock.ts, migrate]
  mock:
    <<: *mock
    networks: [database, ingress]
    command: [node, --env-file=/run/secrets/mock.env, --import, tsx, scripts/deployment-mock.ts]
    healthcheck:
      test: [CMD, node, --env-file=/run/secrets/mock.env, --import, tsx, scripts/deployment-mock-health.ts]
      interval: 30s
      timeout: 10s
      start_period: 30s
  mock-projection:
    <<: *mock
    command: [node, --env-file=/run/secrets/mock.env, --import, tsx, scripts/deployment-mock.ts, worker]
  mock-source:
    <<: *mock
    command: [node, --env-file=/run/secrets/mock.env, --import, tsx, scripts/deployment-mock.ts, source-worker]
networks:
  database:
    external: true
    name: ${DATABASE_NETWORK:?private database network required}
  ingress:
    external: true
    name: ${INGRESS_NETWORK:?inventoried Dokploy ingress network required}
secrets:
  mock-env: {file: '${MOCK_ENV_FILE:?persistent mock environment file required}'}
  mock-config: {file: '${MOCK_CONFIG_FILE:?persistent mock config file required}'}
  database-ca: {file: '${DATABASE_CA_FILE:?persistent database CA file required}'}
