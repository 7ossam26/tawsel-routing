server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    location = /health { access_log off; return 200 'web alive\n'; }
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }
    # Operator endpoints stay reachable only inside the application network.
    location /internal/ { return 404; }
    location /maps/ {
        alias /maps/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }
    location /assets/ {
        root /retained;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/workbox-[a-zA-Z0-9_-]+\.js$ {
        root /retained;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/(sw\.js|update-gate\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
