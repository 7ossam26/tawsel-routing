openapi: 3.1.1
info:
  title: Tawsel public contract — local identity and ERP provisioning
  version: 0.1.0
  description: P07 sessions and P08 versioned ERP provisioning are implemented locally. Other business
    operations remain designed. ERP owns company administration and issuer credentials.
    Source-scoped service operations never accept human actor assertions. No deployed release or
    real ERP compatibility claim.
  license:
    name: Private development contract; no public release
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-lifecycle: implemented
x-owner-phase: 2
paths:
  /api/session/company:
    post:
      operationId: session.resolveCompany
      summary: Resolve company code to safe login context; company selection grants no authority.
      tags:
        - Sessions
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: Invalid input or OIDC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Session expired; retain local evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: CSRF or current access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: Issuer unavailable; retain local evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
  /api/session/login:
    post:
      operationId: session.beginLogin
      summary: Begin OIDC authorization code / PKCE login.
      tags:
        - Sessions
      security: []
      responses:
