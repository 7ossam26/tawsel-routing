                $ref: "#/components/schemas/IntakeError"
        "401":
          description: Durable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "403":
          description: Durable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "404":
          description: Durable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "409":
          description: Revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
