  /api/v1/independent/tasks:
    get:
      operationId: task.listIndependent
      summary: List the authenticated independent driver's own persisted tasks.
      tags:
        - Independent intake
      security:
        - personalSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Own tasks only; unresolved addresses remain visible and non-executable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndependentTaskList"
        "400": &a1
          description: Validation, session or scoped-access failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeError"
        "401": *a1
        "403": *a1
    post:
      operationId: task.createIndependent
      summary: Persist one simple task for the authenticated independent driver.
      tags:
        - Independent intake
      security:
        - personalSession: []
      parameters: &a2
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndependentCommand"
      responses:
        "201":
          description: Durable idempotent command result containing the created task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400": *a1
        "401": *a1
        "403": *a1
        "409": *a1
