          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "409": &a7
          description: Version or command conflict; inspect retained receipt
          content:
            application/problem+json:
              schema:
