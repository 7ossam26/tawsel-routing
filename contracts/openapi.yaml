openapi: 3.1.1
info:
  title: Tawsel public contract foundation — designed, unavailable
  version: 0.1.0
  description: >-
    Phase 02 common protocol schemas only. No public business HTTP operation is implemented
    or released. Empty paths are deliberate. GET /health is workspace-only and excluded.
    Operation ownership is documented in docs/contract-coverage.md; each owning phase
    completes its schemas before adding handlers. Schema IDs use a reserved .invalid
    namespace for offline resolution, not a hosted API or schema service.
  license:
    name: Private development contract; no public release
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-lifecycle: designed
x-owner-phase: 2
