        "503":
          description: Issuer unavailable; retain local evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: iss
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: session_state
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: error_description
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
