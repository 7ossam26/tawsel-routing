  /api/v1/provisioning/configuration:
    get:
      operationId: integration.getConfiguration
      summary: Discover this source, supported protocol and explicitly permitted service operations
      tags:
        - ERP provisioning
      security:
        - ProvisioningService: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceConfiguration"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "503": *a6
  /api/v1/provisioning/status:
    get:
      operationId: provisioning.getStatus
      summary: Read source-scoped current projection and separate issuer reconciliation status
      tags:
        - ERP provisioning
      security:
        - ProvisioningService: []
      parameters:
        - name: entity
          in: query
          required: true
          schema:
            enum:
              - source
              - branch
              - role
              - user
              - driver
        - name: externalId
          in: query
          required: true
          schema:
            $ref: ./common.schema.json#/$defs/ExternalId
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStatus"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "503": *a6
