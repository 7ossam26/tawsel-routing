# Include under the same TLS virtual host as Tawsel. Provision /srv/tawsel/maps
# explicitly from the verified .local/maps bundle; never proxy public map services.
location /maps/ {
    alias /srv/tawsel/maps/;
    autoindex off;
    gzip off;
    max_ranges 1;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600";
    types { application/json json; application/javascript js; image/png png; application/octet-stream pbf pmtiles; }
    default_type application/octet-stream;
}
